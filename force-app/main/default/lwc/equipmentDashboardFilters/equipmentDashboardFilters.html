<template>
  <article class="slds-card slds-m-bottom_medium">
    <div class="slds-card__body slds-card__body_inner">
      <div
        class="slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-end"
      >
        <!-- Search -->
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_3-of-12"
        >
          <lightning-input
            type="search"
            label="Search"
            value={searchTerm}
            onchange={handleSearchChange}
            placeholder="Search by name or Equipment ID"
          ></lightning-input>
        </div>

        <!-- Status -->
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_3-of-12"
        >
          <lightning-combobox
            label="Status"
            value={statusValue}
            options={statusOptions}
            onchange={handleStatusChange}
          ></lightning-combobox>
        </div>

        <!-- Size -->
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_2-of-12"
        >
          <lightning-input
            type="text"
            label="Size"
            value={sizeValue}
            onchange={handleSizeChange}
            placeholder="Exact size"
          ></lightning-input>
        </div>

        <!-- Color -->
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_2-of-12"
        >
          <lightning-input
            type="text"
            label="Color"
            value={colorValue}
            onchange={handleColorChange}
            placeholder="Exact color"
          ></lightning-input>
        </div>

        <!-- Clear Filters -->
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_2-of-12 slds-text-align_right"
        >
          <lightning-button
            label="Clear Filters"
            onclick={clearFilters}
          ></lightning-button>
        </div>
      </div>
    </div>
  </article>
</template>
