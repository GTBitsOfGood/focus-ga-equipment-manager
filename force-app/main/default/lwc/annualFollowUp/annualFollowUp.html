<template>
    <lightning-card title="Annual Check-In" icon-name="utility:clock">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template lwc:if={isLoading}>
                <p role="status">Loading follow-up details…</p>
            </template>

            <template lwc:elseif={hasError}>
                <p role="alert">Follow-up details couldn’t be loaded.</p>
            </template>

            <template lwc:else>
                <dl>
                    <dt class="slds-text-title">Follow-Up Status</dt>
                    <dd>{followUpStatus}</dd>

                    <dt class="slds-text-title slds-m-top_small">
                        Next Scheduled Email
                    </dt>
                    <dd>
                        <lightning-formatted-date-time
                            lwc:if={nextDate}
                            value={nextDate}
                            year="numeric"
                            month="long"
                            day="numeric"
                            time-zone="UTC"
                        ></lightning-formatted-date-time>
                        <span lwc:else>None scheduled</span>
                    </dd>

                    <dt class="slds-text-title slds-m-top_small">
                        Last Successful Email
                    </dt>
                    <dd>
                        <lightning-formatted-date-time
                            lwc:if={lastDate}
                            value={lastDate}
                            year="numeric"
                            month="long"
                            day="numeric"
                            time-zone="UTC"
                        ></lightning-formatted-date-time>
                        <span lwc:else>No email sent yet</span>
                    </dd>
                </dl>
            </template>
        </div>
    </lightning-card>
</template>
