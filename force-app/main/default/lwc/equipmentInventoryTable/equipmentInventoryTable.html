<template>
  <article class="slds-card slds-m-top_medium">
    <div
      class="slds-card__header slds-grid slds-grid_vertical-align-center slds-p-around_medium"
    >
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__figure">
          <lightning-icon
            icon-name="standard:product_item"
            size="small"
          ></lightning-icon>
        </div>
        <div class="slds-media__body">
          <h2 class="slds-card__header-title">Equipment Inventory</h2>
        </div>
      </header>
      <template if:true={showRecordCount}>
        <div class="slds-text-body_small slds-text-color_weak">
          {totalCount} matching records
        </div>
      </template>
    </div>

    <div class="slds-card__body slds-card__body_inner">
      <template if:true={isLoading}>
        <lightning-spinner
          alternative-text="Loading equipment records"
        ></lightning-spinner>
      </template>

      <template if:true={showError}>
        <div
          class="slds-notify slds-notify_alert slds-theme_error"
          role="alert"
        >
          <span class="slds-assistive-text">Error</span>
          <h2>{error}</h2>
        </div>
      </template>

      <template if:true={showEmptyState}>
        <div class="slds-box slds-box_x-small slds-theme_default">
          <p class="slds-text-body_regular">
            No equipment records match the selected filters.
          </p>
        </div>
      </template>

      <template if:true={showTable}>
        <lightning-datatable
          key-field="Id"
          data={records}
          columns={columns}
          hide-checkbox-column
          resize-column-disabled
          sorted-by={sortedBy}
          sorted-direction={sortDirection}
          onsort={handleSort}
        ></lightning-datatable>
      </template>
    </div>
  </article>
</template>
